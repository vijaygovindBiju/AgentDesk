[package]
name = "agentdesk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agentdesk"
path = "src/main.rs"

[dependencies]
agentdesk-model.workspace = true
agentdesk-core.workspace = true
agentdesk-sim.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rcgen = "0.14.10"
rustls = "0.23.45"
tokio-rustls = "0.26.5"
sha2 = "0.11.0"
qrcode = "0.14.1"
uuid = { version = "1.26", features = ["v4"] }
urlencoding = "2.1.3"
agentdesk-relay.workspace = true
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
