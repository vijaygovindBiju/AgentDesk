name: agentdesk
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.4
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/agentdesk_logo.png
    - assets/branding/agentdesk_logo_foreground.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/agentdesk_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E1B33"
  adaptive_icon_foreground: "assets/branding/agentdesk_logo_foreground.png"
