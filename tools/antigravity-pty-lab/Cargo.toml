[package]
name = "antigravity-pty-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
agentdesk-model = { path = "../../core/agentdesk-model" }
agentdesk-core = { path = "../../core/agentdesk-core" }

[[bin]]
name = "antigravity-pty-lab"
path = "src/main.rs"

[lib]
name = "antigravity_pty_lab"
path = "src/lib.rs"
